<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quill is offline</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f6f5f4; color: #322f2e; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #1f1517; color: #f4eeef; } }
    button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Quill needs a connection to load your data.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
